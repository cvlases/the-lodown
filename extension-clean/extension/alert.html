<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>THE LODOWN</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-dark:#2C2416;--bg-medium:#3D3225;--bg-card:#E8E0D0;--bg-light:#F5F0E8;--text-dark:#2C2416;--text-light:#F5F0E8;--text-muted:#8B7D6B;--accent:#8B7355;--accent-gold:#C9A96E;--border:#C4B99A;--heart:#8B4049}
body{min-height:100vh;background:var(--bg-light);font-family:'Source Serif 4',Georgia,serif;color:var(--text-dark);display:flex;flex-direction:column;align-items:center}
.hdr{width:100%;background:var(--bg-dark);padding:24px 40px;display:flex;align-items:center;gap:16px}
.hdr-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:32px;letter-spacing:3px;text-transform:uppercase;color:var(--text-light)}
.alert{width:100%;background:var(--heart);padding:16px 40px;text-align:center}
.alert p{font-family:'Oswald',sans-serif;font-weight:500;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:var(--text-light)}
.alert .own{font-weight:700;color:#FFD5A0}
.cnt{max-width:700px;width:100%;padding:30px 40px 60px;flex:1}
.cnt h2{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;border-bottom:3px solid var(--bg-dark);padding-bottom:8px;display:inline-block}
.back{display:inline-block;margin-bottom:20px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);text-decoration:none;cursor:pointer}
.back:hover{color:var(--text-dark)}
.articles{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.card{background:var(--bg-card);border:1px solid var(--border);padding:18px 20px;position:relative}
.card-tag{position:absolute;top:12px;right:12px;font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:#A09880;color:var(--text-light);padding:3px 8px}
.card-tag.np{background:var(--accent)}
.card h3{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.5px;line-height:1.3;margin-bottom:4px;padding-right:80px}
.card .meta{font-family:'Oswald',sans-serif;font-weight:400;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.card .snip{font-size:13px;line-height:1.6;color:#5C5344;margin-bottom:12px}
.btn-r{display:inline-flex;align-items:center;gap:6px;font-family:'Oswald',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;background:var(--bg-dark);color:var(--text-light);padding:10px 20px;text-decoration:none}
.btn-r:hover{background:var(--bg-medium)}
.loading{text-align:center;padding:50px;font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)}
.loading::after{content:'';display:block;width:28px;height:28px;margin:16px auto 0;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:var(--text-muted);font-size:15px;line-height:1.7}
</style></head><body>
<div class="hdr"><div class="hdr-title">The Lodown</div></div>
<div class="alert" id="alertBanner"><p>YOU'RE READING FROM <span class="own" id="ownerName">CORPORATE MEDIA</span></p></div>
<div class="cnt">
  <a class="back" id="backLink">&larr; Go back to the article</a>
  <h2>Local Alternatives</h2>
  <div class="loading" id="loadingState">Searching your local sources</div>
  <div class="articles" id="arts" style="display:none"></div>
  <div class="empty" id="emptyState" style="display:none"></div>
</div>
<script>
(function(){
  function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
  function escA(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;");}
  function trunc(s,m){return s.length>m?s.slice(0,m)+"\u2026":s;}

  chrome.storage.local.get(["alertInfo"],function(d){
    if(!d.alertInfo){document.getElementById("emptyState").textContent="No alert data.";document.getElementById("emptyState").style.display="block";document.getElementById("loadingState").style.display="none";return;}
    var info=d.alertInfo;
    document.getElementById("ownerName").textContent=info.owner||"Corporate Media";
    document.getElementById("backLink").addEventListener("click",function(){
      if(info.sourceTabId)chrome.tabs.update(info.sourceTabId,{active:true},function(){window.close();});else window.close();
    });
    chrome.runtime.sendMessage({type:"EXTRACT_FROM_TAB",tabId:info.sourceTabId},function(res){
      if(chrome.runtime.lastError||!res||!res.text||res.text.length<50){doFeed();return;}
      chrome.runtime.sendMessage({type:"FIND_ALTERNATIVES",pageText:res.text},function(r){
        document.getElementById("loadingState").style.display="none";
        if(r&&r.success&&r.alternatives&&r.alternatives.length>0)render(r.alternatives);
        else{document.getElementById("emptyState").textContent="No local coverage found for this article.";document.getElementById("emptyState").style.display="block";}
      });
    });
  });

  function doFeed(){
    chrome.runtime.sendMessage({type:"GET_LOCAL_FEED"},function(r){
      document.getElementById("loadingState").style.display="none";
      if(r&&r.success&&r.items&&r.items.length>0)render(r.items);
      else{document.getElementById("emptyState").textContent="No local stories found.";document.getElementById("emptyState").style.display="block";}
    });
  }

  function render(items){
    var c=document.getElementById("arts");c.style.display="flex";
    c.innerHTML=items.map(function(it){
      var tag=it.nonprofit?"NON-PROFIT":(it.sourceName||"LOCAL");
      var cls=it.nonprofit?"card-tag np":"card-tag";
      return '<div class="card"><span class="'+cls+'">'+esc(tag)+'</span>'+
        '<h3>'+esc(trunc(it.title,90))+'</h3>'+
        '<div class="meta">'+esc(it.sourceName||"")+'</div>'+
        '<div class="snip">'+esc(trunc(it.description||"",180))+'</div>'+
        '<a class="btn-r" href="'+escA(it.link)+'" target="_blank" rel="noopener noreferrer">Read All About It</a></div>';
    }).join("");
  }
})();
</script></body></html>
